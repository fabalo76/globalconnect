import org.jetbrains.kotlin.gradle.tasks.KotlinCompile
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id("com.google.devtools.ksp")

}

def enableSslDebugLogs = project.findProperty("enableSslDebugLogs")?.toString()?.toBoolean() ?: false
def enableEcrDebugLogs = project.findProperty("enableEcrDebugLogs")?.toString()?.toBoolean() ?: true
def enableIso8583DebugLogs = project.findProperty("enableIso8583DebugLogs")?.toString()?.toBoolean() ?: false
def showRawPanLogs = project.findProperty("showRawPanLogs")?.toString()?.toBoolean() ?: false
def showComponentsDebugBorders = project.findProperty("showComponentsDebugBorders")?.toString()?.toBoolean() ?: false
def brandingAnimationFullScreenProp = project.findProperty("brandingAnimationFullScreen")
def brandingAnimationFullScreen = brandingAnimationFullScreenProp != null ? brandingAnimationFullScreenProp.toString().toBoolean() : true
tasks.register('checkJavaVersion') {
    doLast {
        println "Current Java version: " + JavaVersion.current()
    }
}
android {
    namespace = "one.globalconnect.paymentapp"
    compileSdk = 36
    // Define the common version number
    def baseVersion = "6.19"
    defaultConfig {
        applicationId = "one.globalconnect.paymentapp"
        minSdk = 26
        targetSdk = 36
        versionCode = 219
        versionName = "(N)$baseVersion" // Default version name

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        buildConfigField "boolean", "ENABLE_SSL_DEBUG_LOGS", enableSslDebugLogs.toString()
        buildConfigField "boolean", "ENABLE_ECR_DEBUG_LOGS", enableEcrDebugLogs.toString()
        buildConfigField "boolean", "ENABLE_ISO8583_DEBUG_LOGS", enableIso8583DebugLogs.toString()
        buildConfigField "boolean", "SHOW_RAW_PAN_LOGS", showRawPanLogs.toString()
        buildConfigField "boolean", "SHOW_COMPONENTS_DEBUG_BORDERS", showComponentsDebugBorders.toString()
        buildConfigField "boolean", "BRANDING_ANIMATION_FULL_SCREEN", brandingAnimationFullScreen.toString()
    }

    signingConfigs {
        debugKeystore {
            storeFile = file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            debuggable = false
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            signingConfig = signingConfigs.debugKeystore
        }
        benchmark {
            initWith release
            signingConfig = signingConfigs.debug
            matchingFallbacks = ['release']
        }

        debug {
            debuggable = true
        }
    }
    flavorDimensions "customer"
    productFlavors {
        banpais {
            dimension "customer"
            applicationIdSuffix = ".banpais"
            versionName = "(N)BP-$baseVersion" // Custom version name for Banpais
        }
        banistmo {
            dimension "customer"
            applicationIdSuffix = ".banistmo"
            versionName = "(N)BNI-$baseVersion" // Custom version name for Banistmo
        }
        banrural {
            dimension "customer"
            applicationIdSuffix = ".banrural"
            versionName = "(N)BR-$baseVersion" // Custom version name for Banrural
        }
        globalconnect {
            dimension "customer"
            applicationIdSuffix = ".globalconnect"
            versionName = "(N)GC-$baseVersion" // Custom version name for Global Connect
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    tasks.withType(KotlinCompile).configureEach {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_21
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    def signingLabels = [(signingConfigs.debugKeystore): "GlobalConnectDebugKey"]

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def stringsFile = file("src/${variant.flavorName}/res/values/strings.xml")
            def appName = ""
            if (stringsFile.exists()) {
                def xml = new XmlSlurper().parse(stringsFile)
                appName = xml.string.find { it.@name == 'app_name' }?.text()?.replace(' ', '_') ?: ""
            }
            def prefix = appName ? "${appName}-" : ""
            def signed = signingLabels[variant.signingConfig] ?: variant.signingConfig?.keyAlias ?: "unsigned"
            outputFileName = "${prefix}${variant.versionName}-${variant.buildType.name}-${signed}.apk"
        }
    }
}

