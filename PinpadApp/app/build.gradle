plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace = "one.globalconnect.pinpad"
    compileSdk = 36

    signingConfigs {
        debug {
            storeFile = file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    defaultConfig {
        applicationId = "one.globalconnect.pinpad"
        minSdk = 26
        targetSdk = 36
        versionCode = 151
        versionName = "1.3.121"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "SERIAL_TRANSPORT", "\"SERIAL\""
        buildConfigField "int", "SERIAL_RS232_PORT", "0"
        buildConfigField "int", "SERIAL_USB_VID", "0x6352"
        buildConfigField "int", "SERIAL_USB_PID", "0x294A"
        buildConfigField "int", "SERIAL_BAUD_RATE", "9600"
        def licensePublicKey = providers.gradleProperty("licenseSigningPublicKeySpkiBase64").orElse("").get()
        buildConfigField "String", "LICENSE_SIGNING_PUBLIC_KEY_SPKI_BASE64", "\"${licensePublicKey}\""
    }

    buildTypes {
        debug {
            buildConfigField "String", "SERIAL_TRANSPORT", "\"RS232\""
            buildConfigField "boolean", "SERIAL_TRACE_ENABLED", "true"
            buildConfigField "boolean", "SERIAL_DETAIL_TRACE_ENABLED", "false"
            buildConfigField "boolean", "EMV_CAPK_TRACE_ENABLED", "true"
            buildConfigField "boolean", "EMV_SDK_DEBUG_LOG_ENABLED", "false"
            buildConfigField "boolean", "SENSORY_KITS_ENABLED", "true"
            buildConfigField "boolean", "SETTINGS_PASSWORD_PROTECTION_ENABLED", "true"
        }
        release {
            buildConfigField "String", "SERIAL_TRANSPORT", "\"SERIAL\""
            buildConfigField "boolean", "SERIAL_TRACE_ENABLED", "false"
            buildConfigField "boolean", "SERIAL_DETAIL_TRACE_ENABLED", "false"
            buildConfigField "boolean", "EMV_CAPK_TRACE_ENABLED", "false"
            buildConfigField "boolean", "EMV_SDK_DEBUG_LOG_ENABLED", "false"
            buildConfigField "boolean", "SENSORY_KITS_ENABLED", "true"
            buildConfigField "boolean", "SETTINGS_PASSWORD_PROTECTION_ENABLED", "true"
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        }
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    packaging {
        jniLibs {
            keepDebugSymbols += ['**/*.so']
        }
    }

}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set(
                output.versionName.map { versionName ->
                    "GlobalConnect-Pinpad-${versionName}-${variant.buildType}-GlobalConnectDebugKey.apk"
                }
            )
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])

    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.camera:camera-core:1.6.1'
    implementation 'androidx.camera:camera-camera2:1.6.1'
    implementation 'androidx.camera:camera-lifecycle:1.6.1'
    implementation 'androidx.camera:camera-view:1.6.1'
    implementation platform('androidx.compose:compose-bom:2025.10.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation 'com.google.zxing:core:3.5.4'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit:2.2.20'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
