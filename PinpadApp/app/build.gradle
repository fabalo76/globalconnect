plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace = "com.uic.pinpad"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.uic.pinpad"
        minSdk = 26
        targetSdk = 36
        versionCode = 124
        versionName = "0.3.111"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "SERIAL_TRANSPORT", "\"AUTO\""
        buildConfigField "int", "SERIAL_RS232_PORT", "0"
        buildConfigField "int", "SERIAL_USB_VID", "0x6352"
        buildConfigField "int", "SERIAL_USB_PID", "0x294A"
        buildConfigField "int", "SERIAL_BAUD_RATE", "9600"
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "SERIAL_TRACE_ENABLED", "true"
            buildConfigField "boolean", "SERIAL_DETAIL_TRACE_ENABLED", "false"
            buildConfigField "boolean", "EMV_CAPK_TRACE_ENABLED", "true"
            buildConfigField "boolean", "EMV_SDK_DEBUG_LOG_ENABLED", "false"
            buildConfigField "boolean", "SENSORY_KITS_ENABLED", "true"
            buildConfigField "boolean", "SETTINGS_PASSWORD_PROTECTION_ENABLED", "true"
        }
        release {
            buildConfigField "boolean", "SERIAL_TRACE_ENABLED", "false"
            buildConfigField "boolean", "SERIAL_DETAIL_TRACE_ENABLED", "false"
            buildConfigField "boolean", "EMV_CAPK_TRACE_ENABLED", "false"
            buildConfigField "boolean", "EMV_SDK_DEBUG_LOG_ENABLED", "false"
            buildConfigField "boolean", "SENSORY_KITS_ENABLED", "true"
            buildConfigField "boolean", "SETTINGS_PASSWORD_PROTECTION_ENABLED", "true"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
